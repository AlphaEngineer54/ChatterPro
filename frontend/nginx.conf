server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache long pour les assets fingerprintés générés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA : toutes les routes (/login, /signup, /chat) servent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
