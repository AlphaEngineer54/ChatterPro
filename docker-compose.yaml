services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MGMT_PORT}:${RABBITMQ_MGMT_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - messaging-app-network

  gateway:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-gateway:latest
    build:
      context: ./backend/Gateway/API-Gateway-Ocelot
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - authservice
      - userservice
      - messageservice
      - dataexportservice
      - notificationservice
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:${GATEWAY_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD}
    healthcheck:
      # Liveness : le port TCP accepte-t-il les connexions ? (bash + coreutils présents dans l'image aspnet)
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${GATEWAY_PORT}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  authservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-authservice:latest
    build:
      context: ./backend/Services/AuthService
      dockerfile: Dockerfile
    ports:
      - "${AUTHSERVICE_PORT}:${AUTHSERVICE_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:${AUTHSERVICE_PORT}
      - AUTHSERVICE_DB_CONNECTION=${AUTHSERVICE_DB_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD}
    depends_on:
      - auth-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${AUTHSERVICE_PORT}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  auth-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=auth_db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/mysql
      - ./backend/Services/AuthService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  dataexportservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-dataexportservice:latest
    build:
      context: ./backend/Services/DataExportService
      dockerfile: Dockerfile
    ports:
      - "${DATAEXPORT_PORT}:${DATAEXPORT_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:${DATAEXPORT_PORT}
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${DATAEXPORT_PORT}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  messageservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-messageservice:latest
    build:
      context: ./backend/Services/MessageService
      dockerfile: Dockerfile
    ports:
      - "${MESSAGESERVICE_PORT}:${MESSAGESERVICE_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:${MESSAGESERVICE_PORT}
      - MESSAGESERVICE_DB_CONNECTION=${MESSAGESERVICE_DB_CONNECTION}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD}
    depends_on:
      - message-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${MESSAGESERVICE_PORT}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  message-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=message_db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - message-db-data:/var/lib/mysql
      - ./backend/Services/MessageService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  notificationservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-notificationservice:latest
    build:
      context: ./backend/Services/NotificationService
      dockerfile: Dockerfile
    ports:
      - "${NOTIFSERVICE_PORT}:${NOTIFSERVICE_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:${NOTIFSERVICE_PORT}
      - NOTIFICATIONSERVICE_DB_CONNECTION=${NOTIFICATIONSERVICE_DB_CONNECTION}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD}
    depends_on:
      - notification-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${NOTIFSERVICE_PORT}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  notification-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=notification_db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - notification-db-data:/var/lib/mysql
      - ./backend/Services/NotificationService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  userservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-userservice:latest
    build:
      context: ./backend/Services/UserService
      dockerfile: Dockerfile
    ports:
      - "${USERSERVICE_PORT}:${USERSERVICE_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:${USERSERVICE_PORT}
      - USERSERVICE_DB_CONNECTION=${USERSERVICE_DB_CONNECTION}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD}
    depends_on:
      - user-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${USERSERVICE_PORT}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  user-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=user_db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - user-db-data:/var/lib/mysql
      - ./backend/Services/UserService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  frontend:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - VITE_GATEWAY_URL=${VITE_GATEWAY_URL}
      - VITE_CHAT_HUB_URL=${VITE_CHAT_HUB_URL}
      - VITE_FRONTEND_PORT=${VITE_FRONTEND_PORT}
    depends_on:
      - gateway
    healthcheck:
      # nginx:alpine embarque wget (busybox).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${FRONTEND_PORT}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - messaging-app-network
    restart: always

volumes:
  auth-db-data:
  message-db-data:
  notification-db-data:
  user-db-data:

networks:
  messaging-app-network:
    driver: bridge
