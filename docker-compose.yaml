services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:${RABBITMQ_PORT:-5672}"
      - "${RABBITMQ_MGMT_PORT:-15672}:${RABBITMQ_MGMT_PORT:-15672}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - messaging-app-network

  gateway:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-gateway:latest
    build:
      context: ./backend/Gateway/API-Gateway-Ocelot
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-5000}:${GATEWAY_PORT:-5000}"
    depends_on:
      - authservice
      - userservice
      - messageservice
      - dataexportservice
      - notificationservice
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:${GATEWAY_PORT:-5000}
      - JWT_SECRET=${JWT_SECRET:-dev-super-secret-change-me-please-0123456789abcdef}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST:-rabbitmq}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT:-5672}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER:-guest}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD:-guest}
    healthcheck:
      # Liveness : le port TCP accepte-t-il les connexions ? (bash + coreutils présents dans l'image aspnet)
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${GATEWAY_PORT:-5000}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  authservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-authservice:latest
    build:
      context: ./backend/Services/AuthService
      dockerfile: Dockerfile
    ports:
      - "${AUTHSERVICE_PORT:-5001}:${AUTHSERVICE_PORT:-5001}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:${AUTHSERVICE_PORT:-5001}
      - AUTHSERVICE_DB_CONNECTION=${AUTHSERVICE_DB_CONNECTION:-server=auth-db;port=3306;database=auth_db;user=chatter;password=chatterpass}
      - JWT_SECRET=${JWT_SECRET:-dev-super-secret-change-me-please-0123456789abcdef}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST:-rabbitmq}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT:-5672}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER:-guest}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD:-guest}
    depends_on:
      - auth-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${AUTHSERVICE_PORT:-5001}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  auth-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=auth_db
      - MYSQL_USER=${MYSQL_USER:-chatter}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-chatterpass}
    volumes:
      - auth-db-data:/var/lib/mysql
      - ./backend/Services/AuthService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  dataexportservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-dataexportservice:latest
    build:
      context: ./backend/Services/DataExportService
      dockerfile: Dockerfile
    ports:
      - "${DATAEXPORT_PORT:-5004}:${DATAEXPORT_PORT:-5004}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:${DATAEXPORT_PORT:-5004}
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${DATAEXPORT_PORT:-5004}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  messageservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-messageservice:latest
    build:
      context: ./backend/Services/MessageService
      dockerfile: Dockerfile
    ports:
      - "${MESSAGESERVICE_PORT:-5003}:${MESSAGESERVICE_PORT:-5003}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:${MESSAGESERVICE_PORT:-5003}
      - MESSAGESERVICE_DB_CONNECTION=${MESSAGESERVICE_DB_CONNECTION:-server=message-db;port=3306;database=message_db;user=chatter;password=chatterpass}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST:-rabbitmq}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT:-5672}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER:-guest}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD:-guest}
    depends_on:
      - message-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${MESSAGESERVICE_PORT:-5003}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  message-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=message_db
      - MYSQL_USER=${MYSQL_USER:-chatter}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-chatterpass}
    volumes:
      - message-db-data:/var/lib/mysql
      - ./backend/Services/MessageService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  notificationservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-notificationservice:latest
    build:
      context: ./backend/Services/NotificationService
      dockerfile: Dockerfile
    ports:
      - "${NOTIFSERVICE_PORT:-5005}:${NOTIFSERVICE_PORT:-5005}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:${NOTIFSERVICE_PORT:-5005}
      - NOTIFICATIONSERVICE_DB_CONNECTION=${NOTIFICATIONSERVICE_DB_CONNECTION:-server=notification-db;port=3306;database=notification_db;user=chatter;password=chatterpass}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST:-rabbitmq}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT:-5672}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER:-guest}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD:-guest}
    depends_on:
      - notification-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${NOTIFSERVICE_PORT:-5005}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  notification-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=notification_db
      - MYSQL_USER=${MYSQL_USER:-chatter}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-chatterpass}
    volumes:
      - notification-db-data:/var/lib/mysql
      - ./backend/Services/NotificationService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  userservice:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-userservice:latest
    build:
      context: ./backend/Services/UserService
      dockerfile: Dockerfile
    ports:
      - "${USERSERVICE_PORT:-5002}:${USERSERVICE_PORT:-5002}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:${USERSERVICE_PORT:-5002}
      - USERSERVICE_DB_CONNECTION=${USERSERVICE_DB_CONNECTION:-server=user-db;port=3306;database=user_db;user=chatter;password=chatterpass}
      - RABBIT_MQ_HOST=${RABBIT_MQ_HOST:-rabbitmq}
      - RABBIT_MQ_PORT=${RABBIT_MQ_PORT:-5672}
      - RABBIT_MQ_USER=${RABBIT_MQ_USER:-guest}
      - RABBIT_MQ_PASSWORD=${RABBIT_MQ_PASSWORD:-guest}
    depends_on:
      - user-db
      - rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/${USERSERVICE_PORT:-5002}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - messaging-app-network
    restart: always

  user-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=user_db
      - MYSQL_USER=${MYSQL_USER:-chatter}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-chatterpass}
    volumes:
      - user-db-data:/var/lib/mysql
      - ./backend/Services/UserService/Models/Schema/model.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - messaging-app-network
    restart: always

  frontend:
    image: ${DOCKER_USERNAME:-dev329}/chatterpro-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - VITE_GATEWAY_URL=${VITE_GATEWAY_URL:-http://localhost:5000}
      - VITE_CHAT_HUB_URL=${VITE_CHAT_HUB_URL:-http://localhost:5003/hubs/chat}
      - VITE_FRONTEND_PORT=${VITE_FRONTEND_PORT:-3000}
    depends_on:
      - gateway
    healthcheck:
      # nginx:alpine embarque wget (busybox).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${FRONTEND_PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - messaging-app-network
    restart: always

volumes:
  auth-db-data:
  message-db-data:
  notification-db-data:
  user-db-data:

networks:
  messaging-app-network:
    driver: bridge
